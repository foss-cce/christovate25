<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shortlisted Teams - Christovate 2025</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --primary-red: #E31E24;
            --gold: #D4AF37;
            --light-gold: #F4E5B3;
            --dark-gold: #B8942C;
        }

        body {
            font-family: 'Inter', sans-serif;
            background: linear-gradient(135deg, #000000 0%, #1a1a1a 100%);
            color: #fff;
            min-height: 100vh;
            padding: 40px 20px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        header {
            text-align: center;
            margin-bottom: 60px;
        }

        .back-btn {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 10px 20px;
            background: rgba(212, 175, 55, 0.1);
            border: 1px solid var(--gold);
            color: var(--gold);
            text-decoration: none;
            border-radius: 8px;
            margin-bottom: 30px;
            transition: all 0.3s ease;
        }

        .back-btn:hover {
            background: rgba(212, 175, 55, 0.2);
            transform: translateX(-5px);
        }

        h1 {
            font-size: 3.5rem;
            font-weight: 900;
            letter-spacing: 4px;
            background: linear-gradient(135deg, var(--gold) 0%, var(--light-gold) 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 20px;
            text-transform: uppercase;
        }

        .subtitle {
            font-size: 1.2rem;
            color: #ccc;
            letter-spacing: 2px;
        }

        .teams-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 30px;
            margin-top: 40px;
        }

        .team-card {
            background: linear-gradient(135deg, rgba(30, 30, 30, 0.8) 0%, rgba(20, 20, 20, 0.9) 100%);
            border: 2px solid rgba(212, 175, 55, 0.3);
            border-radius: 12px;
            padding: 30px;
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
        }

        .team-card::before {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: conic-gradient(
                from 0deg,
                transparent 0deg,
                rgba(212, 175, 55, 0.2) 90deg,
                transparent 180deg,
                rgba(212, 175, 55, 0.2) 270deg,
                transparent 360deg
            );
            animation: rotate 4s linear infinite;
            opacity: 0;
            transition: opacity 0.3s ease;
        }

        .team-card:hover::before {
            opacity: 1;
        }

        .team-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 30px rgba(212, 175, 55, 0.3);
            border-color: var(--gold);
        }

        .team-number {
            font-size: 0.9rem;
            color: var(--gold);
            font-weight: 600;
            margin-bottom: 15px;
            letter-spacing: 1px;
        }

        .team-name {
            font-size: 1.5rem;
            font-weight: 700;
            color: #fff;
            margin-bottom: 15px;
            position: relative;
            z-index: 1;
        }

        .team-info {
            position: relative;
            z-index: 1;
        }

        .team-college {
            font-size: 0.95rem;
            color: #aaa;
            margin-bottom: 10px;
        }

        .team-members {
            margin-top: 15px;
            padding-top: 15px;
            border-top: 1px solid rgba(212, 175, 55, 0.2);
        }

        .members-title {
            font-size: 0.85rem;
            color: var(--gold);
            margin-bottom: 8px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .member {
            font-size: 0.9rem;
            color: #ccc;
            margin-bottom: 5px;
            padding-left: 15px;
            position: relative;
        }

        .member::before {
            content: '▸';
            position: absolute;
            left: 0;
            color: var(--gold);
        }

        .stats {
            text-align: center;
            margin: 60px 0 40px;
            padding: 30px;
            background: rgba(212, 175, 55, 0.05);
            border-radius: 12px;
            border: 1px solid rgba(212, 175, 55, 0.2);
        }

        .stats-number {
            font-size: 4rem;
            font-weight: 900;
            background: linear-gradient(135deg, var(--gold) 0%, var(--light-gold) 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 10px;
        }

        .stats-label {
            font-size: 1.2rem;
            color: #ccc;
            letter-spacing: 2px;
        }

        @keyframes rotate {
            from {
                transform: rotate(0deg);
            }
            to {
                transform: rotate(360deg);
            }
        }

        @media (max-width: 768px) {
            h1 {
                font-size: 2.5rem;
            }

            .teams-grid {
                grid-template-columns: 1fr;
            }

            .stats-number {
                font-size: 3rem;
            }
        }
    </style>
</head>

<body>
    <div class="container">
        <a href="index.html" class="back-btn">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <line x1="19" y1="12" x2="5" y2="12"></line>
                <polyline points="12 19 5 12 12 5"></polyline>
            </svg>
            Back to Home
        </a>

        <header>
            <h1>Shortlisted Teams</h1>
            <p class="subtitle">Christovate 2025 - Phase 3</p>
        </header>

        <div class="stats">
            <div class="stats-number">0</div>
            <div class="stats-label">Teams Advancing to Mentoring Phase</div>
        </div>

        <div class="teams-grid">
            <!-- Team cards will be displayed here -->
            <!-- Example team card structure (currently no teams to display) -->
            <div class="team-card" style="grid-column: 1 / -1; text-align: center; padding: 60px 30px;">
                <h2 style="color: var(--gold); margin-bottom: 20px; font-size: 2rem;">Coming Soon</h2>
                <p style="color: #aaa; font-size: 1.1rem;">Shortlisted teams will be announced here after Phase 2 evaluation.</p>
                <p style="color: #666; margin-top: 15px;">Stay tuned for updates!</p>
            </div>
        </div>
    </div>
</body>

</html>
